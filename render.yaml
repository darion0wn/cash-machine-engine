services:
  - type: web
    name: cash-machine-engine-web
    runtime: docker
    region: frankfurt
    plan: starter
    branch: feature/opportunity-intelligence
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: RUNTIME_ROLE
        value: web
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: SCHEDULER_IN_PROCESS
        value: "false"
      - key: DB_BACKEND
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: cash-machine-engine-db
          property: connectionString
      - key: APP_VERSION
        value: "1.0.0"
      - key: FLASK_DEBUG
        value: "0"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: PRODUCTHUNT_API_KEY
        sync: false
      - key: PRODUCTHUNT_API_SECRET
        sync: false

  - type: cron
    name: cash-machine-engine-refresh
    runtime: docker
    region: frankfurt
    plan: starter
    branch: feature/opportunity-intelligence
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m web.services.refresh_service --trigger scheduled
    schedule: "0 5,11,17 * * *"
    envVars:
      - key: RUNTIME_ROLE
        value: worker
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: SCHEDULER_IN_PROCESS
        value: "false"
      - key: DB_BACKEND
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: cash-machine-engine-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: PRODUCTHUNT_API_KEY
        sync: false
      - key: PRODUCTHUNT_API_SECRET
        sync: false

databases:
  - name: cash-machine-engine-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "17"
