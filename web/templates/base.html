<!doctype html>
<html lang="en">
<head>
  <script>
    document.documentElement.classList.add("js");
  </script>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>
    {{ page_title or app_name }}
  </title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
  >
</head>
<body class="app-body" data-page="{{ active_page or 'dashboard' }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="app-shell">
    <button
      class="sidebar-overlay"
      type="button"
      data-sidebar-overlay
      aria-label="Close navigation"
      tabindex="-1"
    ></button>

    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="brand-mark">CM</div>
        <div>
          <div class="brand-title">{{ app_name }}</div>
          <div class="brand-subtitle">Founder Dashboard</div>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">Navigation</div>
        <nav class="nav flex-column gap-1" aria-label="Primary navigation">
          <a
            class="nav-link {% if active_page == 'dashboard' %}active{% endif %}"
            href="{{ url_for('dashboard.index') }}"
          >
            Dashboard
          </a>
          <a
            class="nav-link {% if active_page == 'feed' %}active{% endif %}"
            href="{{ url_for('pages.feed') }}"
          >
            Feed
          </a>
          <a
            class="nav-link {% if active_page == 'trends' %}active{% endif %}"
            href="{{ url_for('pages.trends') }}"
          >
            Trends
          </a>
          <a
            class="nav-link {% if active_page == 'portfolio' %}active{% endif %}"
            href="{{ url_for('pages.portfolio') }}"
          >
            Portfolio
          </a>
          <a
            class="nav-link {% if active_page == 'reports' %}active{% endif %}"
            href="{{ url_for('pages.reports') }}"
          >
            Reports
          </a>
          <a
            class="nav-link {% if active_page == 'settings' %}active{% endif %}"
            href="{{ url_for('pages.settings') }}"
          >
            Settings
          </a>
        </nav>
      </div>

      <div class="sidebar-card">
        <div class="sidebar-card-label">Current Sprint</div>
        <div class="sidebar-card-value">Sprint 16</div>
        <div class="sidebar-card-text">
          Product dashboard and founder workflow.
        </div>
      </div>
    </aside>

    <main id="main-content" class="main-content">
      <div class="mobile-topbar">
        <div class="mobile-topbar-brand">
          <div class="brand-mark">CM</div>
          <div class="mobile-topbar-copy">
            <div class="brand-title">{{ app_name }}</div>
            <div class="mobile-topbar-subtitle">{{ page_title or "Founder Dashboard" }}</div>
          </div>
        </div>

        <button
          class="sidebar-toggle"
          type="button"
          data-sidebar-toggle
          aria-controls="sidebar"
          aria-expanded="false"
          aria-label="Open navigation"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>

      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
